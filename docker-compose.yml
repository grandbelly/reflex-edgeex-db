version: '3.8'
services:
  rpi-finished-pgai-db:
    build:
      context: ./20251030-rpi-pgcron
      dockerfile: Dockerfile.rpi-pgcron
    container_name: rpi-finished-pgai-db
    environment:
    - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    - POSTGRES_DB=${POSTGRES_DB:-postgres}
    - TIMESCALEDB_TELEMETRY=off
    - TZ=${TZ:-Asia/Seoul}
    ports:
    - "${DB_PORT_HOST:-5432}:5432"
    volumes:
    - pgai_data:/var/lib/postgresql/data
    - ./backup:/backup
    - ./migrations:/migrations
    networks:
    - ksys-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-postgres}
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  rpi-finished-reflex-app:
    build: .
    container_name: rpi-finished-reflex-app
    ports:
    - "${FRONTEND_PORT:-14000}:14000"
    - "${BACKEND_PORT:-14001}:14001"
    environment:
    - DOCKER_ENV=true
    - DB_TARGET=pgai
    - TS_DSN=${TS_DSN:?TS_DSN is required}
    - POSTGRES_CONNECTION_STRING=${POSTGRES_CONNECTION_STRING:?POSTGRES_CONNECTION_STRING is required}
    - APP_ENV=${APP_ENV:-production}
    - TZ=${TZ:-Asia/Seoul}
    - VERSION_TYPE=${VERSION_TYPE:-FULL}
    - ENABLE_AI_FEATURES=${ENABLE_AI_FEATURES:-true}
    - RPI_NODE_ID=${RPI_NODE_ID:-unknown}
    volumes:
    - ./ksys_app:/app/ksys_app
    - ./rxconfig.py:/app/rxconfig.py
    - ./logs:/app/logs
    networks:
    - ksys-network
    depends_on:
      rpi-finished-pgai-db:
        condition: service_healthy
    restart: unless-stopped
    command:
    - reflex
    - run
    - --env
    - prod
    - --backend-host
    - 0.0.0.0
    - --frontend-port
    - '14000'
    - --backend-port
    - '14001'
    - --loglevel
    - info

  rpi-finished-forecast-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: rpi-finished-forecast-scheduler
    environment:
    - DOCKER_ENV=true
    - DB_TARGET=pgai
    - TS_DSN=${TS_DSN:?TS_DSN is required}
    - POSTGRES_CONNECTION_STRING=${POSTGRES_CONNECTION_STRING:?POSTGRES_CONNECTION_STRING is required}
    - TZ=${TZ:-Asia/Seoul}
    - RPI_NODE_ID=${RPI_NODE_ID:-unknown}
    volumes:
    - ./ksys_app:/app/ksys_app
    - ./saved_models:/app/saved_models
    - ./logs:/app/logs
    networks:
    - ksys-network
    depends_on:
      rpi-finished-pgai-db:
        condition: service_healthy
    restart: unless-stopped

  rpi-finished-data-injector:
    build:
      context: .
      dockerfile: Dockerfile.data-injector
    container_name: rpi-finished-data-injector
    environment:
    - DB_HOST=rpi-finished-pgai-db
    - DB_PORT=5432
    - TZ=${TZ:-Asia/Seoul}
    networks:
    - ksys-network
    depends_on:
      rpi-finished-pgai-db:
        condition: service_healthy
    restart: unless-stopped

  timeseries-pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    container_name: rpi-finished-timeseries-pipeline
    environment:
    - TS_DSN=${TS_DSN:?TS_DSN is required}
    - CSV_PATH=/app/all_sensors.csv
    - TZ=${TZ:-Asia/Seoul}
    volumes:
    - ./all_sensors.csv:/app/all_sensors.csv
    networks:
    - ksys-network
    depends_on:
      rpi-finished-pgai-db:
        condition: service_healthy
    restart: unless-stopped

  # Cloudflare Tunnel - same as local ksys (uses ksys.kr domain)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required - get from Cloudflare Zero Trust dashboard}
    networks:
    - ksys-network
    restart: unless-stopped
    depends_on:
    - rpi-finished-reflex-app

networks:
  ksys-network:
    external: true
volumes:
  pgai_data:
    driver: local
